[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gleep-repro"
version = "0.2.0"
description = "Deterministic reproduction and artifact auditing for GLEEP"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy==1.24.4",
  "scipy==1.10.1",
  "scikit-learn==1.2.2",
]

[tool.setuptools.packages.find]
include = ["gleep_repro*"]
